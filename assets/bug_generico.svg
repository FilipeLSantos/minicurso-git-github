<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <rect width="240" height="240" rx="20" fill="#0f172a"/>
  <!-- Glowing radar lines -->
  <circle cx="120" cy="120" r="90" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="120" cy="120" r="60" stroke="#334155" stroke-width="2"/>
  
  <!-- Beetle/Bug Legs -->
  <!-- Left legs -->
  <path d="M75 90 L40 75" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 120 L32 120" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M75 150 L40 165" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <!-- Right legs -->
  <path d="M165 90 L200 75" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M172 120 L208 120" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M165 150 L200 165" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>

  <!-- Antennae -->
  <path d="M105 75 Q90 45 70 50" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M135 75 Q150 45 170 50" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="70" cy="50" r="4" fill="#f87171"/>
  <circle cx="170" cy="50" r="4" fill="#f87171"/>

  <!-- Bug Head -->
  <path d="M100 80 Q120 62 140 80 Z" fill="#ef4444"/>
  <circle cx="110" cy="74" r="2.5" fill="#ffffff"/>
  <circle cx="130" cy="74" r="2.5" fill="#ffffff"/>

  <!-- Bug Body (Shell) -->
  <ellipse cx="120" cy="128" rx="46" ry="48" fill="#ef4444"/>
  <!-- Shell split line -->
  <line x1="120" y1="80" x2="120" y2="175" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
  <!-- Bug dots / circuit style -->
  <circle cx="102" cy="115" r="5" fill="#991b1b"/>
  <circle cx="138" cy="115" r="5" fill="#991b1b"/>
  <circle cx="98" cy="142" r="6" fill="#991b1b"/>
  <circle cx="142" cy="142" r="6" fill="#991b1b"/>
  
  <!-- Alert Warning Cross -->
  <rect x="92" y="196" width="56" height="22" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="211" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ERROR 500</text>
</svg>
